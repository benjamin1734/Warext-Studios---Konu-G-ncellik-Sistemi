name: 1.1.0 Kaynak Senkronizasyonu

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release-validation-1.1.0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-validation-1.1.0
      - name: Denetlenmiş 1.1.0 kaynağını uygula
        shell: bash
        run: |
          test -f .source-ready-1.1.0
          rm -rf /tmp/wrxt-workflows
          cp -a .github/workflows /tmp/wrxt-workflows
          cat .source-1.1.0.part* > /tmp/wrxt-source.b64
          base64 -d /tmp/wrxt-source.b64 > /tmp/wrxt-source.tar.gz
          tar -tzf /tmp/wrxt-source.tar.gz > /dev/null
          tar -xzf /tmp/wrxt-source.tar.gz -C .
          rm -rf upload/src/addons/WarextStudios/ThreadFreshness/_output
          rm -f tools/build_data.php __noop_pr_trigger
          rm -f .source-1.1.0.tar.gz.b64 .source-1.1.0.part* .source-ready-1.1.0
          rm -rf .github/workflows
          mkdir -p .github
          cp -a /tmp/wrxt-workflows .github/workflows
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '1.1.0 detaylı denetim kaynaklarını uygula'
          git push origin HEAD:release-validation-1.1.0
