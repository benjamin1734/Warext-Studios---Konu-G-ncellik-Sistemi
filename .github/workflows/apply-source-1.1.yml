name: 1.1.0 Kaynak Uygulama

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release-validation-1.1.0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-validation-1.1.0
      - name: Denetlenmiş kaynak ağacını uygula
        shell: bash
        run: |
          if [ ! -f .source-ready-1.1.0 ]; then
            echo 'Kaynak zaten uygulandı.'
            exit 0
          fi
          cat .source-1.1.0.part* > /tmp/wrxt-source.b64
          base64 -d /tmp/wrxt-source.b64 > /tmp/wrxt-source.tar.gz
          tar -tzf /tmp/wrxt-source.tar.gz > /dev/null
          tar -xzf /tmp/wrxt-source.tar.gz -C .
          rm -rf upload/src/addons/WarextStudios/ThreadFreshness/_output
          rm -f tools/build_data.php __noop_pr_trigger
          rm -f .source-1.1.0.tar.gz.b64 .source-1.1.0.part* .source-ready-1.1.0
          rm -f .github/workflows/apply-source.yml .github/workflows/apply-source-1.1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m '1.1.0 detaylı denetim düzeltmelerini uygula'
            git push origin HEAD:release-validation-1.1.0
          fi
