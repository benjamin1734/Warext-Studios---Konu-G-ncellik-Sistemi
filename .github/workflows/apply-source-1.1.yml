name: 1.1.0 Kaynak Uygulama

on:
  push:
    branches:
      - release-validation-1.1.0
    paths:
      - '.source-ready-1.1.0'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Denetlenmiş kaynak ağacını uygula
        run: |
          cat .source-1.1.0.part* > /tmp/wrxt-source.b64
          base64 -d /tmp/wrxt-source.b64 > /tmp/wrxt-source.tar.gz
          tar -xzf /tmp/wrxt-source.tar.gz -C .
          rm -rf upload/src/addons/WarextStudios/ThreadFreshness/_output
          rm -f tools/build_data.php
          rm -f .source-1.1.0.tar.gz.b64 .source-1.1.0.part* .source-ready-1.1.0
          rm -f .github/workflows/apply-source.yml .github/workflows/apply-source-1.1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '1.1.0 detaylı denetim düzeltmelerini uygula'
          git push
