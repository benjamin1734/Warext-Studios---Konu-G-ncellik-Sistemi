name: Kaynak Senkronizasyonu

on:
  push:
    branches:
      - release-validation-1.1.0

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Doğrulanmış kaynağı uygula
        run: |
          base64 -d .source-1.1.0.tar.gz.b64 > /tmp/wrxt-source.tar.gz
          tar -xzf /tmp/wrxt-source.tar.gz -C .
          rm -rf upload/src/addons/WarextStudios/ThreadFreshness/_output
          rm -f tools/build_data.php
          rm -f .source-1.1.0.tar.gz.b64
          rm -f .github/workflows/apply-source.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '1.1.0 detaylı denetim düzeltmelerini uygula'
          git push
